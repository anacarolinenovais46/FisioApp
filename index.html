<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica de Fisioterapia</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="container">
        <h1>🏥 Clínica de Fisioterapia</h1>
        <p>Cuidando da sua saúde e bem-estar.</p>
        <p>Agende sua consulta</p>

        <form id="formulario">

            <input type="text" id="nome" placeholder="Nome completo" required>

            <input type="email" id="email" placeholder="E-mail" required>

            <input type="tel" id="telefone" placeholder="Telefone" required>

            <label for="data">Data</label>
            <input type="date" id="data" min="2026-01-01" required>

            <label for="horario">Horário</label>
            <select id="horario" required>
                <option value="">Selecione uma data primeiro</option>
            </select>

            <div class="atendimento-container">
                <h3>Tipo de atendimento</h3>
                <div class="atendimento-opcoes">
                    <label class="radio-label">
                        <input type="radio" name="tipo" value="consultorio" required>
                        <span class="radio-text">Consultório</span>
                    </label>

                    <label class="radio-label">
                        <input type="radio" name="tipo" value="domiciliar" required>
                        <span class="radio-text">Domiciliar</span>
                    </label>
                </div>
            </div>

            <div id="endereco">

                <input type="text" id="cep" placeholder="CEP (somente números)">

                <input type="text" id="rua" placeholder="Rua">

                <input type="text" id="numero" placeholder="Número">

                <input type="text" id="bairro" placeholder="Bairro">

                <label for="cidade">Cidade</label>
                <select id="cidade">
                    <option value="" disabled selected>Selecione a cidade</option>
                    <option value="nova-odessa">Nova Odessa</option>
                    <option value="americana">Americana</option>
                    <option value="sumare">Sumaré</option>
                </select>

            </div>

            <button type="submit">Agendar</button>

        </form>

    </div>

<script src="script.js"></script>

</body>
</html>
